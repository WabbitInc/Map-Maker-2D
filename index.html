<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Maker 2D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="brand-mark">&#10022;</span><span class="brand-name">Map Maker</span><span class="brand-sub">2D</span></div>
  <div class="tb-group">
    <button id="btnNew" class="tb" title="New map">New</button>
    <button id="btnOpen" class="tb" title="Open a Map Maker JSON file (Unity compatible)">Open</button>
    <button id="btnSave" class="tb" title="Save map as JSON (Unity MapJson v2)">Save JSON</button>
    <button id="btnExample" class="tb" title="Load the example map">Example</button>
    <input id="fileOpen" type="file" accept=".json,application/json" hidden>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group" id="toolButtons">
    <button class="tool" data-tool="select" title="Select / move / rotate / scale (S)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg><span>Select</span><kbd>S</kbd></button>
    <button class="tool" data-tool="place" title="Place a sticker (P)"><svg viewBox="0 0 24 24"><path d="M12 2l2.6 6.6L21 9.3l-5 4.4 1.5 6.8L12 17l-5.5 3.5L8 13.7 3 9.3l6.4-.7z"/></svg><span>Sticker</span><kbd>P</kbd></button>
    <button class="tool" data-tool="scatter" title="Scatter brush (B)"><svg viewBox="0 0 24 24"><circle cx="6" cy="8" r="2.2"/><circle cx="14" cy="5" r="1.8"/><circle cx="17" cy="13" r="2.4"/><circle cx="9" cy="16" r="2"/><circle cx="5" cy="21" r="1.4"/><circle cx="19" cy="20" r="1.5"/></svg><span>Scatter</span><kbd>B</kbd></button>
    <button class="tool" data-tool="erase" title="Eraser brush (D)"><svg viewBox="0 0 24 24"><path d="M16 3l5 5-10 10H6l-3-3z M4 21h16" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>Erase</span><kbd>D</kbd></button>
    <button class="tool" data-tool="gen" title="Smart Fill with stickers: connect, grow or fill from your sprites (K)"><svg viewBox="0 0 24 24"><path d="M3 17c3-1 4-5 7-5s3 4 6 4 4-3 5-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="4" cy="17" r="2.6"/><circle cx="20" cy="12" r="2.6"/><path d="M12 2l1.2 2.8L16 6l-2.8 1.2L12 10l-1.2-2.8L8 6l2.8-1.2z"/></svg><span>Smart Fill</span><kbd>K</kbd></button>
    <button class="tool" data-tool="land" title="Land squares: paint water / ice / grass / sand … squares that mesh into coastline (L)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1" opacity=".55"/><rect x="3" y="13" width="8" height="8" rx="1" opacity=".55"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg><span>Land</span><kbd>L</kbd></button>
    <button class="tool" data-tool="river" title="River maker: draw custom rivers, branches and lakes (V)"><svg viewBox="0 0 24 24"><path d="M4 3c5 3-2 7 3 10s-1 6 4 8M14 3c4 3-1 6 3 9s0 6 4 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>River</span><kbd>V</kbd></button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="btnUndo" class="tb icon" title="Undo (Ctrl+Z)">&#8630;</button>
    <button id="btnRedo" class="tb icon" title="Redo (Ctrl+Y)">&#8631;</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="btnGrid" class="tb toggle" title="Show grid">Grid</button>
    <button id="btnSnap" class="tb toggle" title="Snap to grid (G)">Snap</button>
    <input id="gridSize" class="num small" type="number" min="5" max="1000" step="5" title="Grid size (px)">
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="btnZoomOut" class="tb icon" title="Zoom out (-)">&minus;</button>
    <button id="btnZoomPct" class="tb zoom" title="Reset to 100%">100%</button>
    <button id="btnZoomIn" class="tb icon" title="Zoom in (+)">+</button>
    <button id="btnFit" class="tb" title="Fit map to view (F)">Fit</button>
  </div>
  <div class="tb-spacer"></div>
  <button id="btnHelp" class="tb icon" title="Shortcuts (?)">?</button>
  <button id="btnAutoFill" class="finish autofill" title="One click: key out sticker ocean, merge sticker land into one coastline, bridge gaps and connect islands (selection, or everything)">&#10022; Auto-fill</button>
  <button id="btnFinish" class="finish" title="Render the full map and download it as a PNG">&#10003; Finish &amp; Download PNG</button>
</header>

<main id="layout">
  <aside id="left" class="panel">
    <div class="panel-title">Palette <span id="palCount" class="muted"></span></div>
    <div class="pal-controls">
      <input id="search" type="search" placeholder="Search sprites… e.g. swamp, alp 01" autocomplete="off">
      <div class="row">
        <label class="muted" for="thumbSize">Size</label>
        <input id="thumbSize" type="range" min="44" max="150" step="2">
        <label class="chk"><input id="showNames" type="checkbox"> Names</label>
      </div>
    </div>
    <div id="tabs"></div>
    <div id="palette" tabindex="-1"></div>
    <div class="pal-foot">
      <button id="btnRandom" class="mini" title="Pick a random sprite from the current tab (R)">&#9861; Random</button>
      <button id="btnImport" class="mini" title="Import transparent PNG/WebP sprites or a sprite sheet on white (or drop images on the page)">&#8682; Import</button>
      <input id="fileImport" type="file" accept="image/png,image/webp,image/jpeg,.png,.webp,.jpg,.jpeg" multiple hidden>
      <label class="chk" title="After each placed stamp, switch to a random sprite of the same biome"><input id="shuffle" type="checkbox"> Shuffle on place</label>
    </div>
  </aside>

  <section id="center">
    <canvas id="view"></canvas>
    <div id="loading" class="loading hidden">Loading sprites…</div>
    <div id="statusbar">
      <span id="stTool"></span><span id="stPos"></span><span id="stCount"></span><span id="stSel"></span>
      <span id="stHint" class="muted"></span><span id="stSaved" class="muted"></span>
    </div>
  </section>

  <aside id="right" class="panel">
    <div id="rightScroll">
      <section class="card" id="cardSel">
        <h3>Selection</h3>
        <div id="selBody"></div>
      </section>
      <section class="card" id="cardBrush">
        <h3 id="brushTitle">Brush</h3>
        <div id="brushBody"></div>
      </section>
      <section class="card" id="cardMap">
        <h3>Map</h3>
        <div id="mapBody"></div>
      </section>
      <section class="card" id="cardPlug"><h3>Plug &amp; play fill</h3><div id="plugBody"></div></section>
      <section class="card" id="cardFx">
        <h3>Effects</h3>
        <div id="fxBody"></div>
      </section>
    </div>
  </aside>
</main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head"><h2>Finish &amp; Download</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      <div class="export-opts">
        <label>Scale
          <select id="exScale"><option value="0.5">0.5×</option><option value="1" selected>1× (full resolution)</option><option value="2">2×</option></select>
        </label>
        <label class="chk"><input id="exTransparent" type="checkbox"> Transparent background</label>
        <label class="chk"><input id="exEffects" type="checkbox" checked> Effects (shadows, foam, feather)</label>
        <button id="exRender" class="mini">Re-render</button>
      </div>
      <div class="preview-wrap checker"><img id="exPreview" alt="Map preview"><div id="exBusy" class="loading">Rendering…</div></div>
      <div id="exInfo" class="muted"></div>
    </div>
    <div class="modal-foot">
      <button class="tb" data-close>Close</button>
      <button id="exDownload" class="finish" disabled>&#11015; Download PNG</button>
    </div>
  </div>
</div>

<div id="help" class="modal hidden">
  <div class="modal-box narrow">
    <div class="modal-head"><h2>Shortcuts</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body" id="helpBody"></div>
  </div>
</div>

<div id="importModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box wide">
    <div class="modal-head"><h2>Import sprites</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      <div id="impOpts" class="export-opts imp-opts"></div>
      <div id="impGrid" class="imp-grid"></div>
      <div id="impInfo" class="muted"></div>
    </div>
    <div class="modal-foot">
      <button class="tb" data-close>Cancel</button>
      <button id="impConfirm" class="finish">Import</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="assets/manifest.js"></script>
<script src="assets/backgrounds.js"></script>
<script src="assets/example.js"></script>
<script src="assets/meta.js"></script>
<script src="assets/masks.js"></script>
<script src="smartfill.js"></script>
<script src="assets/terrain_tiles.js"></script>
<script src="terrain.js"></script>
<script src="app.js"></script>
</body>
</html>
